name: CI

on:
  push:
  pull_request:
  # Weekly run against the latest NetworkX, to catch breaking releases
  # (like 3.7's new closeness_centrality parameter) before users do.
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: test (Python ${{ matrix.python-version }}, NetworkX ${{ matrix.networkx }})
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported NetworkX, each release since, and the latest.
        include:
          - python-version: "3.10"
            networkx: "3.4.*"
          - python-version: "3.11"
            networkx: "3.5.*"
          - python-version: "3.13"
            networkx: "latest"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rust lint
        run: |
          cargo fmt --check
          cargo clippy --release -- -D warnings
      - name: Build and install
        run: |
          python -m venv .venv
          source .venv/bin/activate
          if [ "${{ matrix.networkx }}" = latest ]; then
            pip install maturin networkx pytest numpy scipy rustworkx
          else
            pip install maturin "networkx==${{ matrix.networkx }}" pytest numpy scipy rustworkx
          fi
          python -c "import networkx; print('NetworkX', networkx.__version__)"
          maturin develop --release
      - name: Compare against NetworkX
        run: |
          source .venv/bin/activate
          pytest -q
      - name: NetworkX test suite with rustnx backend
        run: |
          source .venv/bin/activate
          cd /tmp
          NETWORKX_TEST_BACKEND=rustnx NETWORKX_FALLBACK_TO_NX=True \
            python -m pytest -q -p no:cacheprovider --pyargs networkx
